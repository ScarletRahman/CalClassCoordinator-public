# Fly.io config. One small machine runs the planner, the watcher and the Discord bot.
# First-time setup is in docs/deploy.md.
app = "calclass-planner"
primary_region = "sjc"   # San Jose, closest to Berkeley

[build]
  dockerfile = "Dockerfile"

[env]
  # Public address of the site, used in email links. Change if you add a custom domain.
  APP_URL = "https://calclass-planner.fly.dev"

[mounts]
  source = "ccc_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The watcher and the Discord bot must never sleep, so the machine stays on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "immediate"   # one machine with one volume: stop the old one, start the new one
