# Run the whole app on any Linux server (or locally) with HTTPS from Caddy.
#   cp deploy/.env.example .env   # fill it in
#   docker compose up -d --build
# See docs/deploy.md, "Option B: your own server".
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ccc_data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  ccc_data:
  caddy_data:
