name: Refresh requirements data

# Re-scrapes the official catalog and opens a pull request with whatever changed.
# The catalog changes once a year (new catalog year, usually late spring) with small fixes in
# between, so this runs twice a year and on demand. It takes about an hour because the catalog
# slows down bulk readers; the scripts are deliberately gentle.
on:
  schedule:
    - cron: "17 11 15 6,11 *"   # 15 June and 15 November, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e ".[dev]"
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Scrape the catalog
        run: |
          node scripts/scrape_catalog.js programs-list
          node scripts/scrape_catalog.js programs
          node scripts/scrape_catalog.js courses-list
          python scripts/fetch_payloads.py programs
          python scripts/fetch_payloads.py courses
      - name: Rebuild and validate
        run: |
          python scripts/build_requirements.py --pack
          python scripts/build_requirements.py --strict
          python -m pytest -q tests/test_requirements_data.py
      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/; then
            echo "Catalog unchanged."
            exit 0
          fi
          branch="data/catalog-refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/
          git commit -m "Refresh requirements data from the catalog"
          git push -u origin "$branch"
          gh pr create --title "Refresh requirements data from the catalog" \
            --body "Automatic re-scrape of undergraduate.catalog.berkeley.edu. Review data/requirements/REPORT.md for counts and warnings before merging." \
            --base main --head "$branch"
